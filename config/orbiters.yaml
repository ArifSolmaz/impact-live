# Orbiter follow-up parameters (from research/orbiters.md and research/orbiter_latency.csv, evidence cutoff 2026-10-05).
# [V] verified, [D] derived, [U] unverified. Nothing here is a prediction that a given crater will be imaged.
lro:
  status_2026_10: "operating; imaged Falcon 9 crater 11-12 Aug 2026; LROC/ShadowCam operated by Intuitive Machines since May 2026 [V]"
  approved_end: "no approved end date found; fuel 'until 2027' (NASA, Jun 2024) [V]; FY2027 budget risk [V], LRO-specific outcome [U]"
  p_operational_2028: 0.7      # DECLARED SCENARIO INPUT: assumed probability that LRO is still operating in 2028 (from the fuel
                               # statement and budget risk; not a NASA figure, not measured, and NOT a probability of imaging a crater)
  p_operational_sensitivity: [0.4, 0.9]
  orbit: "near-circular ~57-123 km, i ~82.5-84 deg, period ~117 min [D from Horizons]"
  nac_resolution_m: 0.8
  nac_swath_km: 5.0
  slew_deg_max: 68
  elements_file: data/horizons/horizons_lro_elements_2023-2028.txt   # JPL Horizons osculating elements (query of 2026-10-07 supplied by the author)
  elements_tracking_until: "2026-09-02"    # header: preliminary tag-up solutions to 2026-Sep-02, "prediction after" (not used)
  season_fits: {central: [2, 730], alternatives: [[2, 548], [2, 1095], [1, 365]]}   # [node polynomial degree, fit window (days)]
  # Illumination seasons are COMPUTED by scripts/make_orbiter_seasons.py from the tracking-based part of these elements
  # (to 2026-09-02; the Horizons prediction after that date is not used because its node drift is 5-25 times slower than
  # observed), extrapolated with a quadratic node trend, with ranges from alternative fits and a hold-out test
  # -> outputs/tables/orbiter_seasons.json (low Sun |beta| >= 55 deg, near noon |beta| <= 15 deg). Release 2.0 used dates
  # extrapolated in the research notes from a node history that was not archived (re-audit GE-21); the computed seasons
  # agree with them within one day. A season is an orbit-plane condition, not a guaranteed pass over a target.
  latency_precedents:
    # Days from the EVENT (not from imaging) in research/orbiter_latency.csv, impacts only (soft landings and the natural crater
    # are context). 'first image' is the first DOCUMENTED post-event NAC image, which is not necessarily the first acquired
    # (LADEE is an upper bound). Small, selected sample with censoring; a heuristic, not a calibrated predictive distribution.
    impacts_first_image_days: {HAKUTO-R M1: 0.6, Luna 25: 5.3, ispace M2: 6.2, Falcon 9 stage: 6.3, Beresheet: 10.7, Vikram: 10.7, Longjiang-2: 65.9, GRAIL: 72.6, CE5-T1 stage: 78.0, LADEE: "<=123.1"}
    impacts_first_release_days: {Luna 25: 12, Falcon 9 stage: 13, ispace M2: 15, HAKUTO-R M1: 28, Beresheet: 34, GRAIL: 92, Longjiang-2: 106, CE5-T1 stage: 111, LADEE: 193}
    vikram_note: "first release (day 20) was an unsuccessful mosaic; debris identification was released on day 87"
    summary: "well-located near-side or mid-latitude impacts: first documented image after 0.6-11 days; far-side, high-latitude or poorly located impacts: about 2-4 months; public release 12-193 days after the event"
danuri:
  status: "operating; mission extended to the end of 2027, then low-altitude landing-technology tests and a planned lunar impact in March 2028 (KASA press release, 10 Feb 2025) [V, quote supplied by the author]; orbit ~50-65 x 200-215 km [D]; LUTI imaged the Falcon 9 crater within hours [V]"
  planned_impact: "2028-03"
  available_until: "2028-02-29"     # baseline: not available after the planned impact (re-audit GE-V2-05)
  p_operational_before_planned_end: 0.4   # DECLARED SCENARIO INPUT (release-2.0 value kept; assumed availability, not an imaging probability)
  p_operational_after_planned_end: 0.0
  continued_operation_sensitivity: 0.4   # changed-plan branch (operation after March 2028), reported separately
  luti_gsd_m: "several metres (altitude dependent) [D]"
  elements_file: data/horizons/horizons_kplo_elements_2023-2027.txt  # JPL Horizons osculating elements of Danuri (-155), query of 2026-10-07 supplied by the author
  elements_tracking_until: "2026-09-29"    # header: "Tag-up w/data through September 29, prediction thereafter" (prediction not used)
  season_fits: {central: [1, 300], alternatives: [[2, 300], [1, 180], [1, 730]]}   # the 300- and 180-day windows follow the apolune raise of Sep-Nov 2025 (orbit ~55-60 x 205 km since); the 730-day one includes the earlier orbit
  research_notes_estimate_low_sun: [["2027-03-23", "2027-06-02"], ["2027-09-25", "2027-12-02"]]   # release 2.0 values (research notes), kept for comparison
chandrayaan2:
  status: "operating; ISRO orbit solutions to Nov 2026 [V]; ~7-yr design life ending ~2026 [V]; OHRC 0.25 m, no public tasking route [U]"
  p_operational_2028: 0.3
change7:
  status: "not launched as of Sep 2026 (secondary source) [S]; data access route unknown [U]"
